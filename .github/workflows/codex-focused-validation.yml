name: Nonnegative counts quality gate
on:
  push:
    branches: [validation/nonnegative-counts-276]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run --frozen pytest tests/test_arguments.py tests/checks tests/test_nonnegative_counts.py -q
      - run: uv run --frozen task all
